<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>گروپی هاوکاریی خزمان</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@600;800&family=Noto+Sans+Arabic:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow ledger column, sticky month header, totals pinned under the table */
:root{
  --bg:#f2f4f1; --card:#ffffff; --fg:#17201c; --muted:#5f6c66; --line:#dfe5e0;
  --accent:#0d6a5a; --accent-soft:#e1efeb; --paid:#1f7a46; --paid-soft:#e3f2e8;
  --due:#b4432f; --due-soft:#f8e6e2;
  --display:"Noto Kufi Arabic","Noto Sans Arabic",Tahoma,sans-serif;
  --body:"Noto Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111715; --card:#18201d; --fg:#e6ece8; --muted:#97a59e; --line:#2a3531;
  --accent:#4fbfa8; --accent-soft:#1d3530; --paid:#5cc98a; --paid-soft:#173426;
  --due:#ec8a76; --due-soft:#3a201b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --card:#18201d; --fg:#e6ece8; --muted:#97a59e; --line:#2a3531;
  --accent:#4fbfa8; --accent-soft:#1d3530; --paid:#5cc98a; --paid-soft:#173426;
  --due:#ec8a76; --due-soft:#3a201b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
header.top{background:var(--accent);color:#fff;padding-block:22px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top .in{max-width:760px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end;justify-content:space-between}
h1{font-family:var(--display);font-weight:800;font-size:1.45rem;margin:0;text-wrap:balance}
.role{font-size:.78rem;background:rgba(255,255,255,.18);padding:3px 10px;border-radius:999px}
.tabs{display:flex;gap:6px;margin-block:16px 12px}
.tab{flex:1;font:inherit;font-weight:700;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.monthbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.monthbar label{font-size:.85rem;color:var(--muted)}
select,input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
select:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip{font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--paid-soft);color:var(--paid)}
.chip.open{background:var(--due-soft);color:var(--due)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:right;border:1px solid var(--line);vertical-align:middle}
td.rn,th.rn{width:1%;text-align:center;color:var(--muted);background:var(--bg);font-size:.8rem}
tbody tr:nth-child(even) td:not(.rn){background:color-mix(in srgb,var(--bg) 45%,var(--card))}
td input,td select{width:100%}
td input[type=number]{min-width:90px}
th{font-size:.78rem;color:var(--muted);font-weight:500;letter-spacing:.02em;background:var(--bg)}
td.num,th.num{text-align:left;white-space:nowrap}
tr.paid td.name{color:var(--paid)}
tfoot td{font-weight:700;background:var(--accent-soft)}
tfoot tr+tr td{background:var(--card);font-weight:500;font-size:.9rem}
.amt{font-weight:700}
.status.paid{color:var(--paid);border-color:var(--paid);background:var(--paid-soft)}
.status.due{color:var(--due);border-color:var(--due);background:var(--due-soft)}
.ro-status{font-weight:700}
.ro-status.paid{color:var(--paid)} .ro-status.due{color:var(--due)}
.del{font:inherit;font-size:.8rem;background:var(--card);border:1px solid var(--due);color:var(--due);border-radius:7px;cursor:pointer;padding:4px 10px;white-space:nowrap}
.del.arm{background:var(--due);color:#fff}
.delmonth{display:flex;justify-content:flex-start;margin-top:12px}

.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.add{display:grid;grid-template-columns:1fr 130px auto;gap:8px;margin-bottom:14px;align-items:end;background:var(--card);border:1px solid var(--accent);border-radius:12px;padding:12px}
.addbtn{width:100%;font:inherit;font-weight:800;font-size:1rem;border:0;border-radius:10px;padding:12px;margin-bottom:12px;cursor:pointer;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px}
.addbtn[aria-expanded="true"]{background:var(--card);color:var(--accent);border:1px solid var(--accent)}
.addbtn .plus{font-size:1.3rem;line-height:1}
textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0;resize:vertical}
.add .f{display:flex;flex-direction:column;gap:3px;min-width:0}
.add .f span{font-size:.78rem;color:var(--muted)}
.btn{font:inherit;font-weight:700;border:0;border-radius:9px;padding:9px 16px;cursor:pointer;background:var(--accent);color:#fff}
.btn.ghost{background:var(--card);color:var(--fg);border:1px solid var(--line)}
@media (max-width:480px){.add{grid-template-columns:1fr 1fr}.add .btn{grid-column:1/-1}}
h2{font-family:var(--display);font-weight:600;font-size:1.05rem;margin:22px 0 8px}
.summary{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-bottom:12px}
.stat.big b{font-size:1.4rem}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.stat b{display:block;font-size:1.05rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat span{font-size:.75rem;color:var(--muted)}
.stat.g b{color:var(--paid)} .stat.r b{color:var(--due)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--paid)}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--fg);color:var(--bg);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.savebar .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.savebar .btn{background:var(--accent)}
.note{font-size:.82rem;color:var(--muted);margin-top:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--paid);color:#fff;padding:10px 16px;border-radius:10px;z-index:30;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:no-preference){.tab,.btn{transition:background .15s}}

.login{max-width:380px;margin:32px auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px}
.login h2{margin:0}
.login label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
.login input{font-size:1rem}
.err{color:var(--due);font-size:.85rem;min-height:1.2em}
.out{font:inherit;font-size:.78rem;background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:999px;padding:3px 12px;cursor:pointer}
.saved{font-size:.78rem;opacity:.85}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================
   ئەم بەشە بگۆڕە: firebaseConfig ـی پرۆژەکەت لێرە دابنێ
   (Firebase Console → Project settings → Your apps → Web app)
   ============================================================ */
var firebaseConfig = {
  apiKey: "AIzaSyCgvAwIQG7PTlAUlWC2MTNz2JOWgD9tQBo",
  authDomain: "hawkri-khzman.firebaseapp.com",
  projectId: "hawkri-khzman",
  storageBucket: "hawkri-khzman.firebasestorage.app",
  messagingSenderId: "340192912152",
  appId: "1:340192912152:web:c3e285a301eca60380f46d"
};
/* یوزەرنەیم دەبێتە ئیمەیڵی ناوخۆیی: ahmad → ahmad@khizman.app */
var USER_DOMAIN = "khizman.app";
/* ناوی داتابەیسی Firestore (لە کۆنسۆڵ: Database default) */
var DATABASE_ID = "default";
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
(function(){
var app=initializeApp(firebaseConfig);
var auth=getAuth(app), db=getFirestore(app, DATABASE_ID);
var DOC=doc(db,'app','state');

function pad(n){return (n<10?'0':'')+n}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function ymNow(){return todayStr().slice(0,7)}
function nextYm(ym){var y=+ym.slice(0,4),m=+ym.slice(5,7)+1;if(m>12){m=1;y++}return y+'-'+pad(m)}
function prevYm(ym){var y=+ym.slice(0,4),m=+ym.slice(5,7)-1;if(m<1){m=12;y--}return y+'-'+pad(m)}
function kd(x){return String(x).replace(/[0-9]/g,function(c){return '٠١٢٣٤٥٦٧٨٩'[+c]})}
function label(ym){return 'مانگی '+kd(+ym.slice(5,7))+' / '+kd(ym.slice(0,4))}
function money(n){return (Math.round(n)||0).toLocaleString('en-US')+' د.ع'}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return 'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}

var S=null;
var ui={view:'loading',tab:'month',sel:ymNow(),admin:false,armed:null,toast:'',showAdd:false,temp:{},err:'',saving:false,user:''};

function norm(x){x=x||{};x.members=x.members||[];x.months=x.months||{};if(!x.current)x.current=ymNow();return x}
function newMonth(){return {items:S.members.map(function(m){return {id:m.id,name:m.name,amount:m.amount,paid:false,date:''}})}}
function monthList(){var ks=Object.keys(S.months).sort();var hi=S.current;if(ks.length&&ks[ks.length-1]>hi)hi=ks[ks.length-1];if(ymNow()>hi)hi=ymNow();var lo=(+hi.slice(0,4)-1)+'-01';if(ks.length&&ks[0]<lo)lo=ks[0];var out=[],k=hi;while(k>=lo){out.push(k);k=prevYm(k)}return out}
function curMonth(){return S.months[ui.sel]||(ui.temp[ui.sel]=ui.temp[ui.sel]||newMonth())}
function materialize(){if(!S.months[ui.sel]){S.months[ui.sel]=curMonth();delete ui.temp[ui.sel]}}
function totals(m){var t=0,p=0,n=0;m.items.forEach(function(i){t+=+i.amount||0;if(i.paid){p+=+i.amount||0;n++}});return {total:t,paid:p,due:t-p,count:m.items.length,paidCount:n,done:m.items.length>0&&n===m.items.length}}
function checkAdvance(){var cur=S.months[S.current];if(cur&&totals(cur).done){var nx=nextYm(S.current);if(!S.months[nx])S.months[nx]=newMonth();var was=S.current;S.current=nx;ui.sel=nx;ui.toast=label(was)+' تەواو بوو، '+label(nx)+' کرایەوە'}}

/* ---------- saving (admin only, rules enforce it on the server) ---------- */
var saveTimer=null;
function change(){render();clearTimeout(saveTimer);ui.saving=true;setHdr();saveTimer=setTimeout(save,700)}
function save(){
  setDoc(DOC,JSON.parse(JSON.stringify(S))).then(function(){ui.saving=false;setHdr()})
  .catch(function(e){ui.saving=false;ui.toast=e.code==='permission-denied'?'مافی دەستکاریکردنت نییە':'پاشەکەوت نەکرا، ئینتەرنێت بپشکنە';render()});
}
function setHdr(){var el=document.getElementById('savest');if(el)el.textContent=ui.saving?'پاشەکەوت دەکرێت…':'پاشەکەوت کراوە ✓'}

/* ---------- views ---------- */
function loginView(){
  return '<header class="top"><div class="in"><h1>گروپی هاوکاریی خزمان</h1></div></header><div class="wrap">'+
  '<form class="login" id="loginf"><h2>چوونەژوورەوە</h2>'+
  '<label for="lu">ناوی بەکارهێنەر<input id="lu" autocomplete="username" required autocapitalize="none"></label>'+
  '<label for="lp">وشەی نهێنی<input id="lp" type="password" autocomplete="current-password" required></label>'+
  '<div class="err">'+esc(ui.err)+'</div><button class="btn" type="submit" id="lbtn">چوونەژوورەوە</button></form></div>';
}
function header(){
  return '<header class="top"><div class="in"><h1>گروپی هاوکاریی خزمان</h1><span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'+
  (ui.admin?'<span class="saved" id="savest">پاشەکەوت کراوە ✓</span>':'')+
  '<span class="role">'+esc(ui.user)+' · '+(ui.admin?'بەڕێوەبەر':'تەنها بینین')+'</span><button class="out" id="logout">چوونەدەرەوە</button></span></div></header>';
}
function monthView(){
  var m=curMonth(),t=totals(m),A=ui.admin,keys=monthList(),h='';
  if(A){
    h+='<button class="addbtn" id="toggleadd" type="button" aria-expanded="'+ui.showAdd+'">'+(ui.showAdd?'داخستن':'<span class="plus">+</span> زیادکردنی ناو')+'</button>';
    if(ui.showAdd)h+='<form class="add" id="addf"><label class="f"><span>ناو (هەر ناوێک لە دێڕێک)</span><textarea id="nname" rows="3" required placeholder="ئەحمەد&#10;سارا&#10;کاروان"></textarea></label>'+
      '<label class="f"><span>بڕی پارە (د.ع)</span><input id="namt" type="number" inputmode="numeric" min="0" step="250" required value="10000"></label>'+
      '<button class="btn" type="submit">زیادکردن</button></form>';
  }
  h+='<div class="monthbar"><label for="msel">مانگ</label><select id="msel" style="flex:1">'+
    keys.map(function(k){return '<option value="'+k+'"'+(k===ui.sel?' selected':'')+'>'+label(k)+(k===ymNow()?' (ئێستا)':(S.months[k]?'':' ·'))+'</option>'}).join('')+
    '</select><span class="chip '+(t.done?'ok':'open')+'">'+(t.done?'تەواو بوو':kd(t.paidCount)+' لە '+kd(t.count)+' دراوە')+'</span></div>';
  h+='<div class="panel"><div class="scroll"><table><thead><tr><th class="rn">#</th><th>ناو</th><th class="num">بڕی پارە</th><th>بەروار</th><th>دۆخ</th>'+(A?'<th></th>':'')+'</tr></thead><tbody>';
  if(!m.items.length)h+='<tr><td colspan="'+(A?6:5)+'" class="empty">هێشتا هیچ ناوێک زیاد نەکراوە.</td></tr>';
  m.items.forEach(function(i,ix){
    h+='<tr class="'+(i.paid?'paid':'')+'"><td class="rn">'+(ix+1)+'</td><td class="name">'+esc(i.name)+'</td>';
    if(A){
      h+='<td class="num"><input id="amt-'+i.id+'" data-ix="'+ix+'" data-f="amount" type="number" inputmode="numeric" min="0" step="250" value="'+(+i.amount||0)+'" aria-label="بڕی پارە"></td>'+
         '<td><input id="dt-'+i.id+'" data-ix="'+ix+'" data-f="date" type="date" value="'+esc(i.date||'')+'" aria-label="بەروار"></td>'+
         '<td><select id="st-'+i.id+'" data-ix="'+ix+'" data-f="paid" class="status '+(i.paid?'paid':'due')+'" aria-label="دۆخ"><option value="0"'+(i.paid?'':' selected')+'>نەدراوە</option><option value="1"'+(i.paid?' selected':'')+'>دراوە</option></select></td>'+
         '<td><button class="del'+(ui.armed===i.id?' arm':'')+'" data-del="'+i.id+'">'+(ui.armed===i.id?'دڵنیایت؟':'سڕینەوە')+'</button></td>';
    }else{
      h+='<td class="num amt">'+money(i.amount)+'</td><td>'+(i.date||'—')+'</td><td class="ro-status '+(i.paid?'paid':'due')+'">'+(i.paid?'دراوە':'نەدراوە')+'</td>';
    }
    h+='</tr>';
  });
  var c=A?3:2;
  h+='</tbody><tfoot><tr><td></td><td>کۆی گشتی</td><td class="num">'+money(t.total)+'</td><td colspan="'+c+'"></td></tr>'+
     '<tr><td></td><td>وەرگیراو</td><td class="num" style="color:var(--paid)">'+money(t.paid)+'</td><td colspan="'+c+'"></td></tr>'+
     '<tr><td></td><td>ماوە</td><td class="num" style="color:var(--due)">'+money(t.due)+'</td><td colspan="'+c+'"></td></tr></tfoot></table></div></div>';
  if(A&&S.months[ui.sel])h+='<div class="delmonth"><button class="del'+(ui.armed==='M:'+ui.sel?' arm':'')+'" data-delmonth="'+ui.sel+'">'+(ui.armed==='M:'+ui.sel?'دڵنیایت؟ هەموو تۆمارەکانی '+label(ui.sel)+' دەسڕێنەوە':'سڕینەوەی '+label(ui.sel))+'</button></div>';
  if(A)h+='<p class="note">کاتێک هەمووان پارەکەیان دا، ئەم مانگە تەواو دەبێت و مانگی دواتر خۆکارانە دەکرێتەوە.</p>';
  return h;
}
function reportView(){
  var keys=Object.keys(S.months).sort(),all={paid:0,due:0},years={};
  var rows=keys.map(function(k){var t=totals(S.months[k]);all.paid+=t.paid;all.due+=t.due;
    var y=k.slice(0,4);years[y]=years[y]||{paid:0,due:0,months:0};years[y].paid+=t.paid;years[y].due+=t.due;years[y].months++;
    return '<tr><td>'+label(k)+'</td><td class="num amt" style="color:var(--paid)">'+money(t.paid)+'</td><td>'+kd(t.paidCount)+' لە '+kd(t.count)+'</td><td class="num" style="color:var(--due)">'+money(t.due)+'</td><td><span class="chip '+(t.done?'ok':'open')+'">'+(t.done?'تەواو':'کراوە')+'</span></td>'+(ui.admin?'<td><button class="del'+(ui.armed==='M:'+k?' arm':'')+'" data-delmonth="'+k+'">'+(ui.armed==='M:'+k?'دڵنیایت؟':'سڕینەوە')+'</button></td>':'')+'</tr>'}).reverse().join('');
  var h='<h2>کۆی گشتی هەموو مانگەکان</h2><div class="summary"><div class="stat g big"><span>کۆی گشتی وەرگیراو</span><b>'+money(all.paid)+'</b></div><div class="stat r"><span>ماوە (وەرنەگیراو)</span><b>'+money(all.due)+'</b></div></div>';
  h+='<h2>راپۆرتی هەر مانگێک</h2><div class="panel"><div class="scroll"><table><thead><tr><th>مانگ</th><th class="num">کۆی گشتی (وەرگیراو)</th><th>پارەیان داوە</th><th class="num">ماوە</th><th>دۆخ</th>'+(ui.admin?'<th></th>':'')+'</tr></thead><tbody>'+rows+'</tbody>'+
    '<tfoot><tr><td>کۆی گشتی</td><td class="num" style="color:var(--paid)">'+money(all.paid)+'</td><td></td><td class="num" style="color:var(--due)">'+money(all.due)+'</td><td colspan="'+(ui.admin?2:1)+'"></td></tr></tfoot></table></div></div>';
  h+='<h2>راپۆرتی ساڵانە</h2><div class="panel"><div class="scroll"><table><thead><tr><th>ساڵ</th><th>ژمارەی مانگ</th><th class="num">کۆی گشتی (وەرگیراو)</th><th class="num">ماوە</th></tr></thead><tbody>'+
    Object.keys(years).sort().reverse().map(function(y){var v=years[y];return '<tr><td><b>'+kd(y)+'</b></td><td>'+kd(v.months)+'</td><td class="num amt" style="color:var(--paid)">'+money(v.paid)+'</td><td class="num" style="color:var(--due)">'+money(v.due)+'</td></tr>'}).join('')+
    '</tbody></table></div></div>';
  if(ui.admin)h+='<div class="tools"><label class="btn ghost" for="imp">هاوردەکردنی داتا (data.json)</label><input id="imp" type="file" accept=".json,application/json" hidden></div>';
  return h;
}
function render(){
  var app=document.getElementById('app'),h;
  if(ui.view==='loading')h='<header class="top"><div class="in"><h1>گروپی هاوکاریی خزمان</h1></div></header><div class="wrap"><p class="empty">چاوەڕێ بکە…</p></div>';
  else if(ui.view==='login')h=loginView();
  else h=header()+'<div class="wrap"><div class="tabs" role="tablist"><button class="tab" role="tab" data-tab="month" aria-selected="'+(ui.tab==='month')+'">مانگانە</button><button class="tab" role="tab" data-tab="report" aria-selected="'+(ui.tab==='report')+'">راپۆرت</button></div>'+(ui.tab==='month'?monthView():reportView())+'</div>';
  if(ui.toast)h+='<div class="toast" role="status">'+esc(ui.toast)+'</div>';
  app.innerHTML=h;setHdr();
  if(ui.toast){var tt=ui.toast;setTimeout(function(){if(ui.toast===tt){ui.toast='';var el=document.querySelector('.toast');if(el)el.remove()}},3500)}
}

/* ---------- auth ---------- */
var unsub=null;
onAuthStateChanged(auth,function(u){
  if(unsub){unsub();unsub=null}
  if(!u){ui.view='login';S=null;render();return}
  ui.user=(u.email||'').split('@')[0];
  var timer=setTimeout(function(){if(ui.view==='loading'){ui.err='پەیوەندی بە داتابەیسەوە نەکرا (timeout)';signOut(auth)}},15000);
  getDoc(doc(db,'User',u.uid)).then(function(r){
    if(!r.exists()){clearTimeout(timer);ui.err='ئەم ئەکاونتە ڕێگەپێدراو نییە';signOut(auth);return}
    ui.admin=r.data().role==='admin';
    unsub=onSnapshot(DOC,function(snap){clearTimeout(timer);
      if(ui.saving)return; /* don't overwrite local edits mid-save */
      S=norm(snap.exists()?snap.data():null);
      if(!snap.exists()&&ui.admin){S.months[S.current]=newMonth();setDoc(DOC,S)}
      if(!S.months[ui.sel]&&ui.view!=='app')ui.sel=S.months[ymNow()]?ymNow():S.current;
      ui.view='app';render();
    },function(e){clearTimeout(timer);ui.err='ناتوانرێت داتاکان بخوێنرێنەوە ('+(e&&e.code||'')+')';signOut(auth)});
  }).catch(function(e){clearTimeout(timer);ui.err='ناتوانرێت داتاکان بخوێنرێنەوە ('+(e&&e.code||'')+')';signOut(auth)});
});

document.addEventListener('submit',function(e){
  if(e.target.id==='loginf'){e.preventDefault();
    var u=document.getElementById('lu').value.trim().toLowerCase(),p=document.getElementById('lp').value;
    var email=u.indexOf('@')>-1?u:u+'@'+USER_DOMAIN;
    var b=document.getElementById('lbtn');b.disabled=true;b.textContent='…';
    signInWithEmailAndPassword(auth,email,p).then(function(){ui.err=''}).catch(function(e){ui.err=(e&&(e.code==='auth/invalid-credential'||e.code==='auth/wrong-password'||e.code==='auth/user-not-found'))?'ناوی بەکارهێنەر یان وشەی نهێنی هەڵەیە':'هەڵە: '+(e&&e.code||'');render()});
    return}
  if(e.target.id==='addf'&&ui.admin){e.preventDefault();
    var names=document.getElementById('nname').value.split(/[\n,،]+/).map(function(x){return x.trim()}).filter(Boolean);
    var av=document.getElementById('namt').value,a=av===''?10000:Math.max(0,+av||0);if(!names.length)return;
    materialize();
    names.forEach(function(n){var mem={id:uid(),name:n,amount:a};S.members.push(mem);
      if(!S.months[S.current])S.months[S.current]=newMonth(); else S.months[S.current].items.push({id:mem.id,name:n,amount:a,paid:false,date:''});
      if(ui.sel!==S.current)S.months[ui.sel].items.push({id:mem.id,name:n,amount:a,paid:false,date:''});
    });
    ui.toast=kd(names.length)+' ناو زیاد کرا';ui.showAdd=false;change()}
});
document.addEventListener('click',function(e){
  if(e.target.id==='logout'){signOut(auth);return}
  var t=e.target.closest('[data-tab]');if(t){ui.tab=t.dataset.tab;render();return}
  if(!ui.admin)return;
  if(e.target.closest('#toggleadd')){ui.showAdd=!ui.showAdd;render();var nn=document.getElementById('nname');if(nn)nn.focus();return}
  var d=e.target.closest('[data-del]');if(d){var id=d.dataset.del;
    if(ui.armed!==id){ui.armed=id;render();return}
    ui.armed=null;materialize();S.members=S.members.filter(function(m){return m.id!==id});
    S.months[ui.sel].items=S.months[ui.sel].items.filter(function(i){return i.id!==id});
    if(ui.sel!==S.current&&S.months[S.current])S.months[S.current].items=S.months[S.current].items.filter(function(i){return i.id!==id});
    checkAdvance();change();return}
  var dm=e.target.closest('[data-delmonth]');if(dm){var k=dm.dataset.delmonth;
    if(ui.armed!=='M:'+k){ui.armed='M:'+k;render();return}
    ui.armed=null;delete S.months[k];
    var ks=Object.keys(S.months).sort();
    if(!ks.length){S.current=ymNow();S.months[S.current]=newMonth();ks=[S.current]}
    if(!S.months[S.current])S.current=ks[ks.length-1];
    if(!S.months[ui.sel])ui.sel=S.current;
    ui.toast=label(k)+' سڕایەوە';change();return}
  if(ui.armed&&!e.target.closest('.del,input,select,textarea')){ui.armed=null;render()}
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='msel'){ui.sel=el.value;ui.armed=null;render();return}
  if(el.id==='imp'&&ui.admin&&el.files[0]){var r=new FileReader();r.onload=function(){try{S=norm(JSON.parse(r.result));ui.sel=S.months[ymNow()]?ymNow():S.current;ui.toast='داتاکان هاوردە کران';change()}catch(x){ui.toast='فایلەکە دروست نییە';render()}};r.readAsText(el.files[0]);return}
  if(!ui.admin||el.dataset.ix==null)return;
  materialize();var it=S.months[ui.sel].items[+el.dataset.ix],f=el.dataset.f;
  if(f==='amount'){it.amount=Math.max(0,+el.value||0);var mm=S.members.find(function(x){return x.id===it.id});if(mm&&ui.sel===S.current)mm.amount=it.amount}
  else if(f==='date'){it.date=el.value}
  else if(f==='paid'){it.paid=el.value==='1';if(it.paid&&!it.date)it.date=todayStr();if(!it.paid)it.date=''}
  if(ui.sel===S.current)checkAdvance();
  change();
});
render();
})();
</script>
</body>
</html>
