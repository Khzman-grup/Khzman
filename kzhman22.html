<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>هاوکاریی خزمان</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@600;800&family=Noto+Sans+Arabic:wght@400;500;700&display=swap">
<style>/* Layout: one phone-width ledger column — emerald header band, segmented tabs, card-rows list, totals card pinned under the list */
:root{
  --bg:#eef2f0; --card:#ffffff; --fg:#13231e; --muted:#62736c; --line:#e1e8e4;
  --brand:#0e5a4a; --brand-2:#0a4236; --brand-soft:#e3efeb;
  --gold:#b88a2a; --gold-soft:#f6eedb;
  --paid:#1c7a49; --paid-soft:#e2f3e9; --due:#b9442f; --due-soft:#fae9e5;
  --shadow:0 1px 2px rgba(16,40,32,.06),0 6px 18px rgba(16,40,32,.06);
  --display:"Noto Kufi Arabic","Noto Sans Arabic",Tahoma,sans-serif;
  --body:"Noto Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1311; --card:#141d1a; --fg:#e5ece9; --muted:#93a39c; --line:#22302b;
  --brand:#2f9c84; --brand-2:#0e3a30; --brand-soft:#16302a;
  --gold:#d8b062; --gold-soft:#2c2617;
  --paid:#5fcf8f; --paid-soft:#143022; --due:#ef8b77; --due-soft:#36201b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1311; --card:#141d1a; --fg:#e5ece9; --muted:#93a39c; --line:#22302b;
  --brand:#2f9c84; --brand-2:#0e3a30; --brand-soft:#16302a;
  --gold:#d8b062; --gold-soft:#2c2617;
  --paid:#5fcf8f; --paid-soft:#143022; --due:#ef8b77; --due-soft:#36201b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden;max-width:100%}
.wrap>*{max-width:100%;min-width:0}
.summary>*,.totals>*{min-width:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;direction:rtl;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* header */
header.top{background:linear-gradient(160deg,var(--brand) 0%,var(--brand-2) 100%);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 18px) max(16px,env(safe-area-inset-right,0px)) 54px max(16px,env(safe-area-inset-left,0px));position:relative;overflow:hidden}
header.top::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1.2px);background-size:14px 14px;pointer-events:none}
header.top .in{max-width:720px;margin:0 auto;position:relative;z-index:1}

.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.1rem;color:#fbe7bd;flex:none}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.15rem,6vw,1.6rem);margin:0;line-height:1.3;white-space:nowrap}
.bt{min-width:0;flex:1}
.pbtn{border:0;color:#fff;cursor:pointer;font:inherit;font-size:.78rem}
.sub{font-size:.78rem;opacity:.8}
.iconbtn{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:7px 12px;font-size:.8rem;cursor:pointer;white-space:nowrap}
.metarow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border-radius:999px;padding:4px 12px;font-size:.78rem;font-variant-numeric:tabular-nums}
.pill.gold{background:rgba(232,196,120,.22);color:#fbe7bd}

.wrap{max-width:720px;margin:-38px auto 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(110px + env(safe-area-inset-bottom,0px));position:relative;z-index:2}

/* tabs */
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--card);padding:5px;border-radius:14px;box-shadow:var(--shadow);margin-bottom:14px}
.tab{border:0;background:none;padding:10px 6px;border-radius:10px;font-weight:700;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{background:var(--brand);color:#fff}

.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px}
.sec-title{font-family:var(--display);font-weight:700;font-size:1rem;margin:20px 4px 10px}

/* month header */
.monthcard{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.mnav{display:flex;align-items:center;gap:8px}
.arrow{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:1.1rem;flex:none}
.mselect{flex:1;min-width:0;appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;font-family:var(--display);font-weight:700;font-size:1rem;text-align:center}
.progress{display:flex;align-items:center;gap:10px;font-size:.82rem;color:var(--muted)}
.bar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--paid),#38a56b)}
.chip{font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--paid-soft);color:var(--paid)}
.chip.open{background:var(--gold-soft);color:var(--gold)}

/* add */
.addbtn{width:100%;border:1.5px dashed var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:800;border-radius:14px;padding:12px;cursor:pointer;margin-bottom:12px}
.addbtn[aria-expanded="true"]{border-style:solid;background:var(--card)}
.add{display:grid;gap:10px;margin-bottom:12px}
.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
.f input,.f textarea,.ed input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;min-width:0;width:100%;font-size:.95rem;color:var(--fg)}
.btn{border:0;border-radius:12px;padding:11px 18px;background:var(--brand);color:#fff;font-weight:800;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--fg);border:1px solid var(--line)}

/* ledger list */
.list{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.lhead,.row{display:grid;grid-template-columns:30px 1fr auto auto;gap:10px;align-items:center;padding:10px 12px}
.lhead{font-size:.72rem;color:var(--muted);background:var(--bg);border-bottom:1px solid var(--line);letter-spacing:.02em}
.row{border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.vrow{grid-template-columns:30px 1fr}
.row.exrow{grid-template-columns:1fr auto auto}
.row.paid{background:linear-gradient(270deg,var(--paid-soft),transparent 60%)}
.num{width:26px;height:26px;border-radius:8px;background:var(--bg);display:grid;place-items:center;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.who{min-width:0}
.who b{display:block;font-weight:700;overflow-wrap:anywhere;line-height:1.4}
.who small{display:block;color:var(--muted);font-size:.74rem;font-variant-numeric:tabular-nums}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:.9rem}
.status{border:0;border-radius:999px;padding:5px 12px;font-size:.78rem;font-weight:800;white-space:nowrap}
button.status{cursor:pointer}
.status.paid{background:var(--paid);color:var(--card)}
.status.due{background:var(--due-soft);color:var(--due)}
.editbtn{border:0;background:none;color:var(--muted);cursor:pointer;padding:2px 4px;font-size:.75rem}
.ed{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;background:var(--bg);border-radius:12px;padding:10px;margin-top:4px}
.ed label{display:flex;flex-direction:column;gap:3px;font-size:.72rem;color:var(--muted)}
.ed .del{grid-column:1/-1}
.del{border:1px solid var(--due);background:var(--card);color:var(--due);border-radius:10px;padding:7px 12px;font-size:.8rem;font-weight:700;cursor:pointer}
.del.arm{background:var(--due);color:#fff}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}

/* totals */
.totals{margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tot{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:10px 12px;min-width:0}
.tot span{display:block;font-size:.72rem;color:var(--muted)}
.tot b{display:block;font-variant-numeric:tabular-nums;font-size:1rem;overflow-wrap:anywhere}
.tot.all b{color:var(--fg)} .tot.in b{color:var(--paid)} .tot.out b{color:var(--due)}

/* treasury */
.treasury{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.tcard{min-width:0}
.tcard{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px}
.tcard .lbl{font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.tcard b{display:block;font-family:var(--display);font-size:1.5rem;font-variant-numeric:tabular-nums;margin-top:2px}
.tcard.cur b{color:var(--paid)}
.tcard.grand{background:linear-gradient(150deg,var(--brand),var(--brand-2));color:#fff}
.tcard.grand .lbl{color:rgba(255,255,255,.75)}
.tcard.grand b{font-size:2rem;color:#fff}
.tcard.grand .words{color:#fbe7bd}
.words{display:block;font-size:.85rem;color:var(--gold);margin-top:4px;line-height:1.6}
.prevrow{display:flex;gap:8px;align-items:center;margin-top:6px}
.prevrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;font-family:var(--display);font-size:1.3rem;font-weight:700;color:var(--fg)}
.unit{font-size:.8rem;color:var(--muted)}
.ops{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--muted);font-size:1.2rem;font-weight:700}

/* report tables */
.tbl{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.88rem}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;color:var(--muted);font-weight:500;background:var(--bg)}
tfoot td{font-weight:800;background:var(--brand-soft);border-bottom:0}
.c-in{color:var(--paid);font-weight:700} .c-out{color:var(--due)}
.summary{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:10px}

.note{font-size:.8rem;color:var(--muted);margin:12px 4px 0;line-height:1.7}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.delmonth{margin-top:14px;display:flex}

/* login */
.login{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:12px;max-width:400px;margin:0 auto}
.login h2{font-family:var(--display);margin:0 0 4px;font-size:1.2rem}
.err{color:var(--due);font-size:.85rem;min-height:1.2em}

.saved{font-size:.74rem;opacity:.85}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:12px;z-index:30;max-width:90vw;text-align:center;box-shadow:var(--shadow);font-size:.9rem}
@media (max-width:400px){.totals{grid-template-columns:1fr 1fr}.totals .tot.all{grid-column:1/-1}.ed{grid-template-columns:1fr 1fr}.ed label:first-child{grid-column:1/-1}.summary{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.tab,.status,.btn{transition:background .15s,color .15s}}

.rpick{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.rpick .mselect{flex:1}
.stmt{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px;margin-bottom:6px}
.st-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:2px solid var(--brand);padding-bottom:10px;margin-bottom:10px}
.st-org{font-size:.8rem;color:var(--muted)}
.st-title{font-family:var(--display);font-weight:800;font-size:1.15rem}
.st-date{font-size:.75rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.st-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--muted);margin-bottom:10px}
.st-meta b{color:var(--fg)}
.st-table{font-size:.82rem}
.st-table th,.st-table td{padding:7px 8px}
.st-sum{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.st-line{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:.9rem;border-bottom:1px dashed var(--line)}
.st-line b{font-variant-numeric:tabular-nums;white-space:nowrap}
.st-line.muted{color:var(--muted)}
.st-line.grand{border:0;margin-top:6px;background:var(--brand);color:#fff;border-radius:10px;padding:10px 12px;font-weight:800}
.st-words{font-size:.82rem;color:var(--gold);margin-top:6px;text-align:left}
.preview{position:fixed;inset:0;z-index:50;background:rgba(10,20,16,.72);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(12px,env(safe-area-inset-left,0px))}
.pv-bar{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 auto 12px;max-width:620px;background:var(--card);border-radius:14px;padding:8px;box-shadow:var(--shadow);z-index:2}
.pv-t{font-size:.75rem;color:var(--muted);text-align:center;flex:1}
.paper{--bg:#fff;--card:#fff;--fg:#111;--muted:#555;--line:#d4d4d4;--brand:#0e5a4a;--paid:#1c7a49;--due:#b9442f;--gold:#7a5a12;
  background:#fff;color:#111;max-width:620px;margin:0 auto;padding:28px 24px;border-radius:4px;box-shadow:0 10px 40px rgba(0,0,0,.4);font-size:.9rem}
.paper .st-table{font-size:.78rem}
.paper .st-table th,.paper .st-table td{white-space:normal;padding:6px}
@media print{
  @page{size:A4;margin:12mm}
  html,body{background:#fff!important}
  #app>*{display:none!important}
  #app>.preview{display:block!important;position:static;background:#fff;padding:0;overflow:visible}
  .pv-bar{display:none!important}
  .paper{box-shadow:none;max-width:none;padding:0;margin:0}
  .st-line.grand{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.pw{position:relative;display:flex}
.pw input{flex:1;padding-left:48px}
.eye{position:absolute;left:4px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:1.15rem;cursor:pointer;padding:6px 10px;line-height:1}
</style>

<script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
(function(){
var app=initializeApp(firebaseConfig);
var auth=getAuth(app), db=initializeFirestore(app,{experimentalForceLongPolling:true},DATABASE_ID);
var DOC=doc(db,'app','state'), PUB=doc(db,'app','public');
var P=null;

function pad(n){return (n<10?'0':'')+n}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function ymNow(){return todayStr().slice(0,7)}
function nextYm(ym){var y=+ym.slice(0,4),m=+ym.slice(5,7)+1;if(m>12){m=1;y++}return y+'-'+pad(m)}
function prevYm(ym){var y=+ym.slice(0,4),m=+ym.slice(5,7)-1;if(m<1){m=12;y--}return y+'-'+pad(m)}
function kd(x){return String(x).replace(/[0-9]/g,function(c){return '٠١٢٣٤٥٦٧٨٩'[+c]})}
function label(ym){return 'مانگی '+kd(+ym.slice(5,7))+' / '+kd(ym.slice(0,4))}
function money(n){return (Math.round(n)||0).toLocaleString('en-US')+' د.ع'}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return 'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}

var S=null;
try{var th=localStorage.getItem('khz-theme');if(th)document.documentElement.setAttribute('data-theme',th)}catch(e){}
var ui={preview:false,rsel:null,open:null,view:'loading',tab:'month',sel:ymNow(),admin:false,armed:null,toast:'',showAdd:false,temp:{},err:'',saving:false,user:''};

function norm(x){x=x||{};x.members=x.members||[];x.months=x.months||{};if(!x.current)x.current=ymNow();x.prev=+x.prev||0;x.expenses=x.expenses||[];return x}
function expTotal(list,upto){var t=0;(list||[]).forEach(function(e){if(!upto||(e.date||'').slice(0,7)<=upto)t+=+e.amount||0});return t}

var KU1=['','یەک','دوو','سێ','چوار','پێنج','شەش','حەوت','هەشت','نۆ'];
var KU10=['دە','یازدە','دوازدە','سێزدە','چواردە','پازدە','شازدە','حەڤدە','هەژدە','نۆزدە'];
var KUT=['','','بیست','سی','چل','پەنجا','شەست','حەفتا','هەشتا','نەوەد'];
var KUH=['','سەد','دووسەد','سێسەد','چوارسەد','پێنجسەد','شەشسەد','حەوتسەد','هەشتسەد','نۆسەد'];
function w3(n){var p=[],h=Math.floor(n/100),t=n%100;if(h)p.push(KUH[h]);if(t>=10&&t<20)p.push(KU10[t-10]);else{if(t>=20)p.push(KUT[Math.floor(t/10)]);if(t%10)p.push(KU1[t%10])}return p.join(' و ')}
function kuWords(n){n=Math.round(+n||0);if(n<=0)return 'سفر';var sc=[[1e9,'ملیار'],[1e6,'ملیۆن'],[1e3,'هەزار']],p=[];
  sc.forEach(function(x){var q=Math.floor(n/x[0]);if(q){p.push((q===1&&x[0]===1e3)?x[1]:w3(q)+' '+x[1]);n%=x[0]}});if(n)p.push(w3(n));return p.join(' و ')}
function moneyWords(n){return kuWords(n)+' دینار'}
function nowTime(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())}
function clockText(){var d=new Date();return kd(pad(d.getHours())+':'+pad(d.getMinutes()))+' · '+kd(d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear())}
function allPaid(){var p=0;Object.keys(S.months).forEach(function(k){p+=totals(S.months[k]).paid});return p}
function newMonth(){return {items:S.members.map(function(m){return {id:m.id,name:m.name,amount:m.amount,paid:false,date:''}})}}
function monthList(){var ks=Object.keys(S.months).sort();var hi=ymNow();for(var i=0;i<12;i++)hi=nextYm(hi);if(ks.length&&ks[ks.length-1]>hi)hi=ks[ks.length-1];var lo=(+ymNow().slice(0,4)-1)+'-01';if(ks.length&&ks[0]<lo)lo=ks[0];var out=[],k=hi;while(k>=lo){out.push(k);k=prevYm(k)}return out}
function curMonth(){return S.months[ui.sel]||{items:[]}}
function materialize(){if(!S.months[ui.sel]){S.months[ui.sel]=newMonth()}}
function totals(m){var t=0,p=0,n=0;m.items.forEach(function(i){t+=+i.amount||0;if(i.paid){p+=+i.amount||0;n++}});return {total:t,paid:p,due:t-p,count:m.items.length,paidCount:n,done:m.items.length>0&&n===m.items.length}}
function checkAdvance(){var cur=S.months[S.current];if(cur&&totals(cur).done){var nx=nextYm(S.current);if(!S.months[nx])S.months[nx]=newMonth();var was=S.current;S.current=nx;ui.sel=nx;ui.toast=label(was)+' تەواو بوو، '+label(nx)+' کرایەوە'}}

var saveTimer=null;
function change(){render();clearTimeout(saveTimer);ui.saving=true;setHdr();saveTimer=setTimeout(save,700)}
function publicData(){var mo={};Object.keys(S.months).forEach(function(k){mo[k]={paid:totals(S.months[k]).paid,items:S.months[k].items.map(function(i){return {id:i.id,name:i.name,amount:+i.amount||0,paid:!!i.paid,date:i.date||'',time:i.time||''}})}});return {current:S.current,names:S.members.map(function(m){return m.name}),months:mo,prev:S.prev||0,expenses:S.expenses.map(function(e){return {amount:+e.amount||0,note:e.note||'',date:e.date||''}})}}
function savePublic(){return setDoc(PUB,publicData()).catch(function(){})}
function save(){
  savePublic();
  setDoc(DOC,JSON.parse(JSON.stringify(S))).then(function(){ui.saving=false;setHdr()})
  .catch(function(e){ui.saving=false;ui.toast=e.code==='permission-denied'?'مافی دەستکاریکردنت نییە':'پاشەکەوت نەکرا، ئینتەرنێت بپشکنە';render()});
}

function render(){
  var app=document.getElementById('app'),h;
  if(ui.view==='loading')h=topBar()+'<div class="wrap"><div class="card empty">چاوەڕێ بکە…'+(ui.slow?'<br><br>پەیوەندی ئینتەرنێت لاوازە یان نییە.<br><br><button class="btn" id="refresh2" type="button">↻ دووبارە هەوڵ بدەرەوە</button>':'')+'</div></div>';
  else if(ui.view==='login')h=loginView();
  else h=topBar(esc(ui.user)+' · '+(ui.admin?'بەڕێوەبەر':'تەنها بینین'))+'<div class="wrap"><div class="tabs" role="tablist">'+
    (ui.admin?[['month','مانگانە'],['treasury','خەزێنە'],['expenses','سەرف'],['report','راپۆرت']]:[['month','مانگانە'],['expenses','سەرف'],['report','راپۆرت']]).map(function(x){return '<button class="tab" role="tab" data-tab="'+x[0]+'" aria-selected="'+(ui.tab===x[0])+'">'+x[1]+'</button>'}).join('')+
    '</div>'+(ui.tab==='expenses'?expensesView():!ui.admin?(ui.tab==='month'?monthView():viewerReport()):ui.tab==='month'?monthView():ui.tab==='treasury'?treasuryView():reportView())+'</div>';
  if(ui.preview&&ui.view==='app'&&ui.admin&&S.months[ui.rsel])h+=previewView();
  if(ui.toast)h+='<div class="toast" role="status">'+esc(ui.toast)+'</div>';
  app.innerHTML=h;setHdr();
  if(ui.toast){var tt=ui.toast;setTimeout(function(){if(ui.toast===tt){ui.toast='';var el=document.querySelector('.toast');if(el)el.remove()}},3500)}
}

/* ---------- auth ---------- */
var unsub=null;
onAuthStateChanged(auth,function(u){
  if(unsub){unsub();unsub=null}
  if(!u){ui.view='login';S=null;P=null;ui.tab='month';render();return}
  ui.user=(u.email||'').split('@')[0];
  var timer=setTimeout(function(){if(ui.view==='loading'){ui.err='پەیوەندی بە داتابەیسەوە نەکرا (timeout)';signOut(auth)}},15000);
  getDoc(doc(db,'User',u.uid)).then(function(r){
    if(!r.exists()){clearTimeout(timer);ui.err='ئەم ئەکاونتە ڕێگەپێدراو نییە';signOut(auth);return}
    ui.admin=r.data().role==='admin';
    if(!ui.admin){ui.tab='month';var firstV=true;
      unsub=onSnapshot(PUB,function(snap){clearTimeout(timer);P=snap.exists()?snap.data():{names:[],months:{},prev:0};P.names=P.names||[];P.months=P.months||{};P.expenses=P.expenses||[];P.prev=+P.prev||0;var vm={};Object.keys(P.months).forEach(function(k){vm[k]={items:P.months[k].items||[]}});S=norm({members:P.names.map(function(n){return {name:n}}),months:vm,current:P.current||ymNow(),prev:P.prev,expenses:P.expenses});if(firstV){firstV=false;ui.sel=S.months[ymNow()]?ymNow():S.current}ui.view='app';render()},
        function(e){clearTimeout(timer);ui.err='ناتوانرێت داتاکان بخوێنرێنەوە ('+(e&&e.code||'')+')';signOut(auth)});
      return;
    }
    var firstPub=true;
    unsub=onSnapshot(DOC,function(snap){clearTimeout(timer);
      if(ui.saving)return; /* don't overwrite local edits mid-save */
      S=norm(snap.exists()?snap.data():null);
      if(!snap.exists()&&ui.admin){S.months[S.current]=newMonth();setDoc(DOC,S)}
      if(!S.months[ui.sel]&&ui.view!=='app')ui.sel=S.months[ymNow()]?ymNow():S.current;
      if(firstPub){firstPub=false;savePublic()}
      ui.view='app';render();
    },function(e){clearTimeout(timer);ui.err='ناتوانرێت داتاکان بخوێنرێنەوە ('+(e&&e.code||'')+')';signOut(auth)});
  }).catch(function(e){clearTimeout(timer);ui.err='ناتوانرێت داتاکان بخوێنرێنەوە ('+(e&&e.code||'')+')';signOut(auth)});
});

document.addEventListener('submit',function(e){
  if(e.target.id==='loginf'){e.preventDefault();
    var u=document.getElementById('lu').value.trim().toLowerCase(),p=document.getElementById('lp').value;
    var email=u.indexOf('@')>-1?u:u+'@'+USER_DOMAIN;
    var b=document.getElementById('lbtn');b.disabled=true;b.textContent='…';
    signInWithEmailAndPassword(auth,email,p).then(function(){ui.err=''}).catch(function(e){ui.err=(e&&(e.code==='auth/invalid-credential'||e.code==='auth/wrong-password'||e.code==='auth/user-not-found'))?'ناوی بەکارهێنەر یان وشەی نهێنی هەڵەیە':'هەڵە: '+(e&&e.code||'');render()});
    return}
  if(e.target.id==='expf'&&ui.admin){e.preventDefault();
    var a=Math.max(0,+document.getElementById('exa').value||0),n=document.getElementById('exn').value.trim(),dd=document.getElementById('exd').value||todayStr();
    if(!a)return;S.expenses.push({id:uid(),amount:a,note:n,date:dd});ui.toast='سەرف تۆمار کرا: '+money(a);change();return}
  if(e.target.id==='addf'&&ui.admin){e.preventDefault();
    var names=document.getElementById('nname').value.split(/[\n,،]+/).map(function(x){return x.trim()}).filter(Boolean);
    var av=document.getElementById('namt').value,a=av===''?10000:Math.max(0,+av||0);if(!names.length)return;
    materialize();
    names.forEach(function(n){var mem={id:uid(),name:n,amount:a};S.members.push(mem);
      if(!S.months[S.current])S.months[S.current]=newMonth(); else S.months[S.current].items.push({id:mem.id,name:n,amount:a,paid:false,date:''});
      if(ui.sel!==S.current)S.months[ui.sel].items.push({id:mem.id,name:n,amount:a,paid:false,date:''});
    });
    ui.toast=kd(names.length)+' ناو زیاد کرا';ui.showAdd=false;change()}
});
document.addEventListener('click',function(e){
  if(e.target.closest('#theme')){var d=document.documentElement.getAttribute('data-theme');var dark=d?d==='dark':matchMedia('(prefers-color-scheme: dark)').matches;var nt=dark?'light':'dark';document.documentElement.setAttribute('data-theme',nt);try{localStorage.setItem('khz-theme',nt)}catch(x){}render();return}
  if(e.target.closest('#eye')){var pi=document.getElementById('lp');if(pi){var show=pi.type==='password';pi.type=show?'text':'password';e.target.closest('#eye').textContent=show?'🙈':'👁'}return}
  if(e.target.closest('#refresh')||e.target.id==='refresh2'){location.reload();return}
  if(e.target.id==='print'){window.print();return}
  if(e.target.id==='preview'){ui.preview=true;render();return}
  if(e.target.id==='closepv'){ui.preview=false;render();return}
  if(e.target.id==='logout'){signOut(auth);return}
  var st=e.target.closest('[data-step]');if(st){var nk=+st.dataset.step>0?nextYm(ui.sel):prevYm(ui.sel);if(monthList().indexOf(nk)>-1){ui.sel=nk;ui.armed=null;ui.open=null;render()}return}
  var t=e.target.closest('[data-tab]');if(t){ui.tab=t.dataset.tab;render();return}
  if(!ui.admin)return;
  var tg=e.target.closest('[data-toggle]');if(tg){materialize();var it=S.months[ui.sel].items[+tg.dataset.toggle];if(it){it.paid=!it.paid;if(it.paid){if(!it.date){it.date=todayStr();it.time=nowTime()}}else{it.date='';it.time=''}if(ui.sel===S.current)checkAdvance();change()}return}
  var ed=e.target.closest('[data-edit]');if(ed){ui.open=ui.open===ed.dataset.edit?null:ed.dataset.edit;ui.armed=null;render();return}
  if(e.target.id==='fillmonth'){materialize();ui.toast=label(ui.sel)+' پڕ کرایەوە';change();return}
  if(e.target.closest('#toggleadd')){ui.showAdd=!ui.showAdd;render();var nn=document.getElementById('nname');if(nn)nn.focus();return}
  var d=e.target.closest('[data-del]');if(d){var id=d.dataset.del;
    if(ui.armed!==id){ui.armed=id;render();return}
    ui.armed=null;materialize();S.members=S.members.filter(function(m){return m.id!==id});
    S.months[ui.sel].items=S.months[ui.sel].items.filter(function(i){return i.id!==id});
    if(ui.sel!==S.current&&S.months[S.current])S.months[S.current].items=S.months[S.current].items.filter(function(i){return i.id!==id});
    checkAdvance();change();return}
  var dx=e.target.closest('[data-delexp]');if(dx){var xi=+dx.dataset.delexp;if(ui.armed!=='E:'+xi){ui.armed='E:'+xi;render();return}ui.armed=null;S.expenses.splice(xi,1);ui.toast='سەرف سڕایەوە';change();return}
  var dm=e.target.closest('[data-delmonth]');if(dm){var k=dm.dataset.delmonth;
    if(ui.armed!=='M:'+k){ui.armed='M:'+k;render();return}
    ui.armed=null;delete S.months[k];
    var ks=Object.keys(S.months).sort();
    if(!ks.length){S.current=ymNow();S.months[S.current]=newMonth();ks=[S.current]}
    if(!S.months[S.current])S.current=ks[ks.length-1];
    if(!S.months[ui.sel])ui.sel=S.current;
    ui.toast=label(k)+' سڕایەوە';change();return}
  if(ui.armed&&!e.target.closest('.del,input,select,textarea')){ui.armed=null;render()}
});
document.addEventListener('input',function(e){if(e.target.id==='exa'){var w=document.getElementById('exw'),v=+e.target.value||0;if(w)w.textContent=v>0?moneyWords(v):'';return}if(e.target.id==='prev'){var v=Math.max(0,+e.target.value||0),t=v+allPaid()-expTotal(S.expenses);var a=document.getElementById('prevw'),b=document.getElementById('totb'),c=document.getElementById('totw');if(a)a.textContent=moneyWords(v);if(b)b.textContent=money(t);if(c)c.textContent=moneyWords(t)}});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='rsel'){ui.rsel=el.value;render();return}
  if(el.id==='msel'){ui.sel=el.value;ui.armed=null;ui.open=null;render();return}
  if(el.id==='imp'&&ui.admin&&el.files[0]){var r=new FileReader();r.onload=function(){try{S=norm(JSON.parse(r.result));ui.sel=S.months[ymNow()]?ymNow():S.current;ui.toast='داتاکان هاوردە کران';change()}catch(x){ui.toast='فایلەکە دروست نییە';render()}};r.readAsText(el.files[0]);return}
  if(el.id==='prev'&&ui.admin){S.prev=Math.max(0,+el.value||0);change();return}
  if(!ui.admin||el.dataset.ix==null)return;
  materialize();var it=S.months[ui.sel].items[+el.dataset.ix],f=el.dataset.f;
  if(f==='amount'){it.amount=Math.max(0,+el.value||0);var mm=S.members.find(function(x){return x.id===it.id});if(mm&&ui.sel===S.current)mm.amount=it.amount}
  else if(f==='date'){it.date=el.value}
  else if(f==='time'){it.time=el.value}
  else if(f==='paid'){it.paid=el.value==='1';if(it.paid&&!it.date){it.date=todayStr();it.time=nowTime()}if(!it.paid){it.date='';it.time=''}}
  if(ui.sel===S.current)checkAdvance();
  change();
});
render();
setInterval(function(){var c=document.getElementById('clock');if(c)c.textContent=clockText()},15000);
/* خۆنوێکردنەوە: ئەگەر index.html ئاماژە بە وەشانێکی نوێ بکات، ئەپەکە خۆی دەچێتە سەری */
function checkVersion(){
  if(location.protocol.indexOf('http')!==0||ui.saving)return;
  fetch('index.html?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():''}).then(function(t){
    var m=/url=([^"'>\s]+)/i.exec(t||'');if(!m)return;
    var target=m[1].split('?')[0],cur=location.pathname.split('/').pop()||'index.html';
    var vn=function(x){var q=/(\d+)/.exec(x||'');return q?+q[1]:0};if(target&&target!==cur&&target!=='index.html'&&vn(target)>vn(cur)){ui.toast='وەشانی نوێ هات، نوێ دەبێتەوە…';render();setTimeout(function(){location.replace(target+'?v='+Date.now())},1200)}
  }).catch(function(){});
}
setTimeout(checkVersion,3000);
setTimeout(function(){if(ui.view==='loading'){ui.slow=true;render()}},12000);
setInterval(checkVersion,120000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)checkVersion()});
})();
</script>
